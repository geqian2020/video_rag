<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视频知识库 · 本地检索</title>
<style>
:root{color-scheme:light;--bg:#f4f5f2;--paper:#fff;--ink:#172b28;--muted:#64736d;--line:#dce3dd;--green:#185d4e;--soft:#eaf2ed;--red:#a13434}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.55}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #6ba994;outline-offset:3px}
.wrap{max-width:1180px;margin:auto;padding:36px 28px 56px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:24px;border-bottom:1px solid var(--line)}.brand{font-weight:750;letter-spacing:.02em}.brand span{color:var(--green);margin-right:10px}.badge{font-size:12px;border:1px solid var(--line);border-radius:30px;padding:5px 12px;background:var(--paper);color:var(--muted)}.badge.ok{color:var(--green);background:var(--soft)}h1{font-size:34px;font-weight:650;letter-spacing:-.04em;line-height:1.3;margin:34px 0 10px}.lead{margin:0 0 28px;color:var(--muted)}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:28px;align-items:start}.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px}.panel h2{font-size:15px;margin:0 0 18px}label{display:block;font-size:13px;font-weight:650;margin-bottom:7px}input,select,textarea{width:100%;color:var(--ink);background:#fff;border:1px solid #cdd7d0;border-radius:8px;padding:10px 12px}textarea{resize:vertical;line-height:1.65}.field{margin-bottom:20px}.hint{font-size:12px;color:var(--muted);margin:7px 0 0}.sidebar-note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:18px;margin:20px 0 0}.query-box{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px}.query-box textarea{min-height:112px;border:0;background:#f7f9f6;padding:14px}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px}.primary{border:0;background:var(--green);color:white;border-radius:8px;padding:10px 24px;font-weight:650}.quiet{border:1px solid var(--line);background:white;color:var(--muted);border-radius:7px;padding:6px 12px;font-size:12px}.samples{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 22px}.sample{border:1px solid var(--line);background:transparent;border-radius:30px;padding:5px 12px;color:var(--muted);font-size:12px}.result-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 14px}.result-head h2{font-size:17px;margin:0}.status{font-size:13px;color:var(--muted);margin:0;white-space:pre-wrap}.error{color:var(--red);background:#fff0ed;border:1px solid #f0d1c9;border-radius:9px;padding:12px 16px;margin:16px 0;white-space:pre-wrap;overflow-wrap:anywhere}.empty{border:1px dashed #cad5cc;border-radius:14px;padding:44px 24px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:8px}.result{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;padding:20px}.result-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.rank{font-size:12px;background:var(--soft);color:var(--green);border-radius:5px;padding:3px 9px;font-weight:650}.time{font-size:13px;font-variant-numeric:tabular-nums}.video{font-size:12px;color:var(--muted);overflow-wrap:anywhere;margin:10px 0 12px}.evidence{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85;margin:0}.scores{border-top:1px solid #eef1ed;padding-top:11px;margin-top:16px;display:flex;flex-wrap:wrap;gap:14px;color:var(--muted);font-size:11px}.footer-actions{display:flex;gap:8px;flex-wrap:wrap}.context-box{margin-top:18px}.context-box summary{cursor:pointer;font-size:13px;color:var(--muted)}.context-box textarea{margin-top:10px;min-height:150px;font-size:12px}.hidden{display:none!important}footer{font-size:12px;color:var(--muted);margin-top:32px;text-align:center}
@media(max-width:760px){.wrap{padding:20px 16px 36px}.layout{grid-template-columns:1fr;gap:18px}h1{font-size:27px}.panel{padding:18px}.panel .fields{display:grid;grid-template-columns:1fr 100px;gap:14px}.panel .fields .field{margin:0}.sidebar-note{margin-top:16px}.result-head{align-items:flex-start}.actions .hint{font-size:11px}.top{padding-bottom:16px}.badge{font-size:11px}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top"><div class="brand"><span>◈</span> VIDEO KNOWLEDGE</div><div id="health" class="badge" role="status">正在检查本地服务</div></header>
  <h1>提一个问题，找到视频中的原文。</h1>
  <p class="lead">语义与关键词共同匹配，返回可以核对的来源和时间范围。</p>
  <div class="layout">
    <aside class="panel" aria-label="检索设置">
      <h2>检索设置</h2>
      <div class="fields">
        <div class="field"><label for="api-key">访问密钥</label><input id="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="粘贴启动终端中的 Access key"><p class="hint">仅供当前页面使用，不写入浏览器存储。</p></div>
        <div class="field"><label for="top-k">返回条数</label><select id="top-k"><option value="5">5 条</option><option value="10">10 条</option><option value="20">20 条</option><option value="30">30 条</option></select></div>
      </div>
      <details><summary>限定视频（可选）</summary><div style="margin-top:12px"><label for="video-ids">视频 ID</label><textarea id="video-ids" rows="3" placeholder="留空搜索全部视频"></textarea><p class="hint">多个完整 video_id 用逗号或换行分隔。</p></div></details>
      <p class="sidebar-note">检索链：Dense + BM25 + 重排。<br>结果是视频转录证据，请结合原文判断相关性。</p>
    </aside>
    <section aria-label="提问和匹配结果">
      <form id="search-form" class="query-box">
        <label for="query">你想了解什么？</label>
        <textarea id="query" maxlength="2000" required placeholder="例如：PA 校准过程中如何采集测试数据？"></textarea>
        <div class="actions"><span class="hint">Ctrl / ⌘ + Enter 提交</span><button id="search-button" class="primary" type="submit">检索原文 →</button></div>
      </form>
      <div class="samples" aria-label="示例问题"><button type="button" class="sample">PA 校准需要哪些步骤？</button><button type="button" class="sample">NIB 软件和硬件如何配合？</button><button type="button" class="sample">测试异常应该如何排查？</button></div>
      <div id="error" class="error hidden" role="alert"></div>
      <div class="result-head"><h2 id="result-title">原文证据</h2><p id="status" class="status" role="status" aria-live="polite">等待提问</p></div>
      <div id="results"><div class="empty"><strong>从一个具体问题开始</strong>描述产品、操作或现象，查看最相关的视频片段。</div></div>
      <section id="result-tools" class="hidden" aria-label="结果操作">
        <div class="footer-actions"><button id="copy-context" type="button" class="quiet">复制证据文本</button><button id="download-json" type="button" class="quiet">导出结果 JSON</button><button id="clear-results" type="button" class="quiet">清空结果和密钥</button></div>
        <details class="context-box"><summary>查看可复制的完整证据文本</summary><textarea id="context" readonly aria-label="完整证据文本"></textarea></details>
      </section>
    </section>
  </div>
  <footer>本地检索 · 原文可追溯 · 匹配分数不代表答案正确率</footer>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
let latest = null;
let active = false;
const number = value => Number.isFinite(value) ? value.toFixed(4) : '—';
function timestamp(seconds) {
  if (!Number.isFinite(seconds) || seconds < 0) return '—';
  const s = Math.floor(seconds);
  return [Math.floor(s / 3600), Math.floor(s % 3600 / 60), s % 60].map(v => String(v).padStart(2, '0')).join(':');
}
function node(tag, className, text) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  if (text !== undefined) el.textContent = text;
  return el;
}
function showError(message) { $('error').textContent = message; $('error').classList.remove('hidden'); }
function render(data) {
  $('results').replaceChildren();
  $('result-title').textContent = `原文证据 · ${data.results.length} 条`;
  if (!data.results.length) {
    const empty = node('div', 'empty');
    empty.append(node('strong', '', '没有匹配到视频片段'), node('span', '', '尝试调整关键词，或取消视频 ID 限定。'));
    $('results').append(empty);
  }
  data.results.forEach((hit, i) => {
    const article = node('article', 'result');
    const top = node('div', 'result-top');
    top.append(node('span', 'rank', `匹配 ${String(i + 1).padStart(2, '0')}`), node('span', 'time', `${timestamp(hit.start_ts)} — ${timestamp(hit.end_ts)}`));
    article.append(top, node('div', 'video', hit.video_id), node('p', 'evidence', hit.text));
    const scores = node('div', 'scores');
    scores.append(node('span', '', `重排分数 ${number(hit.rerank_score)}`), node('span', '', `融合分数 ${number(hit.rrf_score)}`), node('span', '', hit.timestamp_quality === 'estimated' ? '时间范围为估计值' : 'ASR 时间范围'));
    article.append(scores);
    $('results').append(article);
  });
  $('context').value = data.context || '';
  $('result-tools').classList.remove('hidden');
}
async function checkHealth() {
  try {
    const response = await fetch('/health', {cache: 'no-store'});
    const data = await response.json();
    if (!response.ok || data.status !== 'ok') throw new Error();
    $('health').textContent = '● 本地服务已就绪'; $('health').classList.add('ok');
  } catch { $('health').textContent = '本地服务未连接'; }
}
$('search-form').addEventListener('submit', async event => {
  event.preventDefault();
  if (active) return;
  $('error').classList.add('hidden');
  const key = $('api-key').value.trim();
  const query = $('query').value.trim();
  if (!key) { showError('请先填写启动终端中显示的访问密钥。'); $('api-key').focus(); return; }
  if (!query) { showError('请输入要检索的问题。'); $('query').focus(); return; }
  const ids = $('video-ids').value.split(/[\n,，]+/).map(s => s.trim()).filter(Boolean);
  if (ids.length > 100) { showError('视频 ID 最多填写 100 个。'); return; }
  const body = {query, top_k: Number($('top-k').value)};
  if (ids.length) body.video_ids = ids;
  active = true; latest = null;
  $('search-button').disabled = true; $('search-button').textContent = '正在匹配…';
  $('results').replaceChildren(node('div', 'empty', '正在检索视频原文并重新排序，请稍候。'));
  $('result-tools').classList.add('hidden'); $('context').value = ''; $('result-title').textContent = '原文证据';
  const started = performance.now();
  const timer = setInterval(() => { $('status').textContent = `正在检索 · ${Math.floor((performance.now() - started) / 1000)} 秒`; }, 1000);
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 300000);
  $('status').textContent = '正在检索…';
  try {
    const response = await fetch('/search', {method: 'POST', headers: {'Content-Type': 'application/json', 'X-API-Key': key}, body: JSON.stringify(body), cache: 'no-store', signal: controller.signal});
    const data = await response.json();
    if (!response.ok) {
      const messages = {401: '访问密钥不正确，请与启动终端中的 Access key 核对。', 422: '问题、返回条数或视频限定不符合要求，请缩短问题并检查设置。', 503: '检索服务暂时不可用，请查看运行 API 的终端。'};
      throw new Error(messages[response.status] || `请求失败（HTTP ${response.status}）`);
    }
    if (!Array.isArray(data.results)) throw new Error('服务返回格式不正确。');
    latest = {query, response: data}; render(data);
    $('status').textContent = `耗时 ${((performance.now() - started) / 1000).toFixed(1)} 秒`;
  } catch (error) {
    $('status').textContent = '本次检索未完成';
    showError(error.name === 'AbortError' ? '等待已超过 5 分钟。请查看服务终端，确认本次检索是否仍在执行。' : error.message || '无法连接本地服务。');
    $('results').replaceChildren(node('div', 'empty', '调整设置后可以重新检索。'));
  } finally {
    clearInterval(timer); clearTimeout(timeout); active = false;
    $('search-button').disabled = false; $('search-button').textContent = '检索原文 →';
  }
});
$('query').addEventListener('keydown', event => { if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') $('search-form').requestSubmit(); });
document.querySelectorAll('.sample').forEach(button => button.addEventListener('click', () => { $('query').value = button.textContent; $('query').focus(); }));
$('copy-context').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('context').value); $('status').textContent = '证据文本已复制'; }
  catch { const details = $('context').closest('details'); details.open = true; $('context').focus(); $('context').select(); $('status').textContent = '请按 Ctrl / ⌘ + C 复制选中的证据'; }
});
$('download-json').addEventListener('click', () => {
  if (!latest) return;
  const url = URL.createObjectURL(new Blob([JSON.stringify(latest, null, 2)], {type: 'application/json;charset=utf-8'}));
  const link = node('a'); link.href = url; link.download = 'video-rag-results.json'; document.body.append(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
});
$('clear-results').addEventListener('click', () => {
  latest = null; $('api-key').value = ''; $('context').value = ''; $('result-tools').classList.add('hidden');
  $('results').replaceChildren(node('div', 'empty', '结果和密钥已清空，可以开始下一次检索。'));
  $('result-title').textContent = '原文证据'; $('status').textContent = '等待提问';
});
checkHealth();
</script>
</body>
</html>
